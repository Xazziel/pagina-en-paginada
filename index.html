<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soy una entrada</title>
    <style>
        body {
            margin: 20px;
            color: #171717;
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.2rem;
        }

        .intro {
            font-size: 1.6rem;
            line-height: 1.25;
        }

        hr {
            margin: 32px 0 20px;
        }

        .field {
            display: grid;
            grid-template-columns: minmax(180px, 260px) minmax(0, 1fr);
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            font-size: 1.25rem;
        }

        .field input {
            box-sizing: border-box;
            width: 100%;
            max-width: 520px;
            min-height: 38px;
            padding: 6px 9px;
            font: 1rem Arial, sans-serif;
        }

        fieldset {
            border: 0;
            margin: 12px 0;
            padding: 0;
            font-size: 1.25rem;
        }

        .choices {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-left: 8px;
        }

        .choices label {
            white-space: nowrap;
        }

        button {
            margin: 8px 8px 0 0;
            padding: 8px 18px;
            font: 1rem Arial, sans-serif;
        }

        @media (max-width: 560px) {
            body {
                margin: 16px;
            }

            .intro {
                font-size: 1.25rem;
            }

            .field {
                grid-template-columns: 1fr;
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Soy una entrada</h1>
        <p class="intro">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
        </p>

        <hr>

        <form id="registro" action="home.html" method="post">
            <div class="field">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required>
            </div>
            <div class="field">
                <label for="usuario">Ingrese su nombre</label>
                <input type="text" id="usuario" name="usuario" minlength="5" maxlength="15" required>
            </div>
            <div class="field">
                <label for="apellido">Ingrese su apellido</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>
            <div class="field">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" pattern="[0-9]+" inputmode="numeric" title="Escribe solo números del 0 al 9" required>
            </div>
            <div class="field">
                <label for="id-usuario">ID de usuario</label>
                <input type="text" id="id-usuario" name="id-usuario" value="USR-001" disabled>
            </div>

            <fieldset>
                <legend>Género:</legend>
                <span class="choices">
                    <label for="mujer">Mujer <input type="radio" id="mujer" name="genero" value="mujer" required></label>
                    <label for="hombre">Hombre <input type="radio" id="hombre" name="genero" value="hombre"></label>
                </span>
            </fieldset>
            <fieldset>
                <legend>Preferencias:</legend>
                <span class="choices">
                    <label for="pizza">Pizza <input type="checkbox" id="pizza" name="preferencias" value="pizza"></label>
                    <label for="pozole">Pozole <input type="checkbox" id="pozole" name="preferencias" value="pozole"></label>
                </span>
            </fieldset>

            <button type="submit">Guardar y entrar</button>
        </form>
    </main>
    <script>
        document.getElementById("registro").addEventListener("submit", function (event) {
            event.preventDefault();
            window.location.href = "home.html";
        });
    </script>
</body>
</html>
